language: python

python:
  - "2.7"

sudo: false
cache: pip
  apt: true
  directories:
    - $HOME/.cache/pip

virtualenv:
  system_site_packages: false

git:
  submodules: false
  depth: false

services:
  - postgresql

addons:
  apt:
    sources:
      - pov-wkhtmltopdf
    # Search your sources alias here:
    # https://github.com/travis-ci/apt-source-whitelist/blob/master/ubuntu.json
    packages:
      # - build-essential                 # Pre-installed
      # - curl                            # Pre-installed
      - expect-dev
      # - less-plugin-clean-css           # Pre-installed
      # - lessc                           # Pre-installed
      - libffi-dev
      - libssl-dev
      # - nodejs                          # Pre-installed
      # - npm                             # Pre-installed
      - python-dev
      # - python-setuptools               # Pre-installed
      # - wkhtmltopdf                     # Pre-installed
      - zlib1g

before_install:
  # Use Zeroincombenze(R) tools
  - git clone https://github.com/zeroincombenze/tools.git ${HOME}/tools --single-branch --depth=1
  - ${HOME}/tools/install_tools.sh -qpt
  - source ${HOME}/devel/activate_tools
  # - "export DISPLAY=:99.0"
  # - "sh -e /etc/init.d/xvfb start"
  # - "export DISPLAY=:99.0"
  # - "sh -e /etc/init.d/xvfb start"
  # - sleep 3 # give xvfb some time to start
  # - mv ${HOME}/tools/maintainer-quality-tools ${HOME}

install:
  - travis_install_env
  # tests of document_ftp and delivery fail. The following two are excluded because they depend on delivery
  # account_invoice_sequential_dates fails with FatturaPA
  - export EXCLUDE=hw_scanner,hw_escpos,document_ftp,delivery,stock_invoice_directly,claim_from_delivery,account_invoice_sequential_dates,l10n_it_corrispettivi,test_lint

env:
  global:
  - TRAVIS_DEBUG_MODE="2"
  - WKHTMLTOPDF_VERSION="0.12.4"
  - VERSION="10.0" TESTS="0" LINT_CHECK="0" ODOO_TNLBOT="0"


  matrix:
  - LINT_CHECK="1" LINT_CHECK_LEVEL="MINIMAL"
  - TESTS="1" ODOO_REPO="zeroincombenze/OCB"
  - TESTS="1" ODOO_REPO="OCA/OCB"
  - TESTS="1" ODOO_REPO="odoo/odoo"


script:
  - travis_run_tests

after_success:
  - travis_after_tests_success
